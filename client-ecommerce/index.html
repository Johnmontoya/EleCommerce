<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/SVG/icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <title>EleCommerce</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Bot de Chat de Vynce -->
  <!-- Copia este código en tu sitio web -->
<div style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;">
    <!-- Widget de Chat Antigravity -->
<div id="vynce-chat-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 999999; font-family: sans-serif;">
    <!-- El Chat (Iframe) -->
    <div id="vynce-iframe-wrapper" style="display: none; width: 380px; height: 600px; margin-bottom: 20px; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;">
        <iframe 
            src="http://localhost:5173/widget/738d66d6-561c-4ed8-afa3-38dc7a04a1c5" 
            style="width: 100%; height: 100%; border: none;"
            title="Asistente Virtual"
        ></iframe>
    </div>

    <!-- El Botón Flotante -->
    <button id="vynce-chat-trigger" style="float: right; width: 60px; height: 60px; border-radius: 20px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: #10b981; box-shadow: 0 10px 20px rgba(16,185,129,0.4);">
        <!-- Icono Chat -->
        <svg id="vynce-icon-open" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <!-- Icono Cerrar (X) -->
        <svg id="vynce-icon-close" style="display: none;" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
</div>

<script>
    (function() {
        const trigger = document.getElementById('vynce-chat-trigger');
        const wrapper = document.getElementById('vynce-iframe-wrapper');
        const iconOpen = document.getElementById('vynce-icon-open');
        const iconClose = document.getElementById('vynce-icon-close');
        let isOpen = false;

        trigger.addEventListener('click', () => {
            isOpen = !isOpen;
            if (isOpen) {
                wrapper.style.display = 'block';
                wrapper.style.transform = 'translateY(0)';
                wrapper.style.opacity = '1';
                iconOpen.style.display = 'none';
                iconClose.style.display = 'block';
                trigger.style.transform = 'rotate(90deg)';
                trigger.style.background = '#ef4444'; // Color rojo al cerrar
                trigger.style.boxShadow = '0 10px 20px rgba(239,68,68,0.4)';
            } else {
                wrapper.style.display = 'none';
                iconOpen.style.display = 'block';
                iconClose.style.display = 'none';
                trigger.style.transform = 'rotate(0deg)';
                trigger.style.background = '#10b981'; // Tu color de marca
                trigger.style.boxShadow = '0 10px 20px rgba(16,185,129,0.4)';
            }
        });

        // Efecto hover
        trigger.addEventListener('mouseenter', () => {
            if(!isOpen) trigger.style.transform = 'scale(1.1) translateY(-5px)';
        });
        trigger.addEventListener('mouseleave', () => {
            if(!isOpen) trigger.style.transform = 'scale(1) translateY(0)';
        });
    })();
</script>

</div>


</body>

</html>
