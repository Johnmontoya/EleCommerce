name: Vercel Production Deployment

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  JWT_SECRET: "test_secret"
  POSTGRESQL_LOCAL: ${{ secrets.POSTGRESQL_LOCAL }}
  IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
  IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
  IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}

jobs:
  test-client:
    name: 🧪 Client Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client-ecommerce/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./client-ecommerce

      - name: Run linter
        run: npm run lint
        working-directory: ./client-ecommerce
        
      - name: Build project
        run: npm run build
        working-directory: ./client-ecommerce

  test-server:
    name: 🧪 Server Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server-ecommerce/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./server-ecommerce

      - name: Prisma Generate
        run: npx prisma generate
        working-directory: ./server-ecommerce

      - name: Run Linter
        run: npm run lint
        working-directory: ./server-ecommerce

      - name: Run tests
        run: npm run test
        working-directory: ./server-ecommerce
        
      - name: Build project
        run: npm run build
        working-directory: ./server-ecommerce

  Deploy-Production:
    name: 🚀 Deploy to Production
    needs: [test-client, test-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
